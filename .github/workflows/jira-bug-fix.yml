name: Jira Issue Fix

# Fired by Jira Automation when a reviewer approves a triaged Bug or Task by
# moving it from Triage Review to In Progress.
on:
  repository_dispatch:
    types: [jira-bug-approved]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make Jira helper scripts executable
        run: chmod +x scripts/jira-*.sh

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Jira issue ${{ github.event.client_payload.issue_key }} was approved
            for implementation. Start by running:
              scripts/jira-get-issue.sh "${{ github.event.client_payload.issue_key }}"

            Read the issue summary, description, labels, and comments. Locate
            the earlier triage comment containing Verdict / Why this happens /
            Proposed fix / Files touched / Test plan / Risk / Confidence and
            treat it as the approved plan.

            If its verdict is not "Confirmed - should be addressed," comment
            on the Jira issue explaining that implementation cannot proceed
            without a confirmed triage, then stop without changing code.

            Otherwise:
            1. Create a branch named
               fix/${{ github.event.client_payload.issue_key }}-<short-slug>.
            2. If vitest is not already a devDependency, add it, add a
               "test": "vitest run" package script, and add npm test to
               .github/workflows/ci.yml after lint.
            3. Write a regression or behavior test that demonstrates the
               issue, confirm it fails, implement the correction, and confirm
               the test passes.
            4. Run npm run lint, npm run build, and npm test. Do not proceed
               until all three pass.
            5. Commit, push, and open a PR against main titled
               "fix(${{ github.event.client_payload.issue_key }}): <short description>".
               Link the Jira issue in the PR body and summarize the correction
               and its test.
            6. Post the PR URL and a short summary with jira-comment.sh, then
               run:
                 scripts/jira-transition.sh "${{ github.event.client_payload.issue_key }}" "PR Review"

            Never merge the PR unless a human explicitly asks on the PR.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(scripts/jira-comment.sh:*),Bash(scripts/jira-transition.sh:*),Bash(scripts/jira-get-issue.sh:*)"
            --max-turns 100
