name: Jira Issue Triage & Plan

# Fired by Jira Automation for newly-created Bug or Task items, and again
# when a reviewer sends an item back to To Do for additional triage.
on:
  repository_dispatch:
    types: [jira-bug-triage]

permissions:
  contents: read
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make Jira helper scripts executable
        run: chmod +x scripts/jira-*.sh

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            A new issue was reported in Jira: ${{ github.event.client_payload.issue_key }}

            Summary: ${{ github.event.client_payload.summary }}

            Description:
            ${{ github.event.client_payload.description }}

            Investigate this codebase to determine whether this is actionable.
            An actionable issue may be a genuine defect or a small, clearly
            defined missed requirement whose intended behavior was never built.
            Determine how it should be addressed. This is a read-only
            investigation: do not edit, create, or delete any files.

            Cross-reference plans/plan-v5.md for intended MVP behavior where
            relevant. Use git log and git blame when they help establish when
            behavior changed or why it exists.

            When finished, post exactly ONE comment on the issue by running:
              scripts/jira-comment.sh "${{ github.event.client_payload.issue_key }}" "<body>"

            The comment body must use exactly these section labels, each
            followed by a blank line before the next section:

            Verdict: Confirmed - should be addressed / Not applicable / Needs more info / Likely duplicate of <KEY>

            Why this happens: specific file and line references and why,
            whether that is a defect or a requirement that was never
            implemented. If the verdict is "Needs more info," state exactly
            what information is missing instead.

            Proposed fix: what to change and why. Omit this section unless the
            verdict is "Confirmed - should be addressed."

            Files touched: files expected to change. Omit this section unless
            the verdict is "Confirmed - should be addressed."

            Test plan: the regression or behavior test that proves the current
            issue and then proves the correction works. Omit this section
            unless the verdict is "Confirmed - should be addressed."

            Risk: blast radius and what could break. Omit this section unless
            the verdict is "Confirmed - should be addressed."

            Confidence: low, medium, or high, and why. State plainly that this
            is code review rather than a live reproduction when no test or
            staging reproduction was performed.

            After the comment posts successfully, run:
              scripts/jira-transition.sh "${{ github.event.client_payload.issue_key }}" "Triage Review"

            Do not run any other Jira script and do not edit repository files.
          claude_args: |
            --allowedTools "Bash(scripts/jira-comment.sh:*),Bash(scripts/jira-transition.sh:*),Bash(git log:*),Bash(git blame:*),Read,Glob,Grep"
            --max-turns 40
